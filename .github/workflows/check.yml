# Pull requests (adding or changing a line of sources.jsonl): every repository there must have a usable latest release, and plugins.jsonl
# must still be well formed. plugins.jsonl itself is written by the update workflow, not by hand.
name: check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Each source has a usable latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_index.py --check
      - name: plugins.jsonl is well formed
        run: python scripts/check_index.py plugins.jsonl --offline
